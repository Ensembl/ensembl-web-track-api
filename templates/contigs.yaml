genome_id: <genome_id>
category:
  track_category_id: assembly
  label: Assembly
  type: Genomic
type: regular
label: Reference sequence
display_order: 0
on_by_default: true
description: Displays the sequence underlying the assembly
sources:
  - name: Genome Reference Consortium
    url: https://genomereference.org
settings:
  contig-shimmer:
    program: contig
    scales: [26, 100, 3]
    values: [{shimmer: true}]
  contig:
    scales: [7, 100, 3]
  zoomed-seq:
    scales: [0, 6, 2]
datafiles:
  contig: contigs.bb
